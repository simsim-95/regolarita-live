<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regolarità live</title>
<style>
:root{--bg:#fff;--fg:#111;--mu:#666;--ln:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--mu:#999;--ln:#333}}
body{margin:0 auto;padding:12px;max-width:720px;font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:20px 0 4px}.mu{color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.et{font-size:22px;font-weight:600}.sc{font-size:30px;font-weight:700}
.g{color:#2e7d32}.b{color:#0288d1}.r{color:#c62828}.live{font-weight:700;color:#c62828}
details{border-bottom:1px solid var(--ln)}summary{cursor:pointer;font-weight:600;padding:10px 0}
.filtro-riga{display:flex;align-items:center;gap:8px;margin-top:10px}
.filtro-riga select{font:16px system-ui,sans-serif;padding:6px 8px;border-radius:6px;border:1px solid var(--ln);background:var(--bg);color:var(--fg)}
.tab-riga{display:flex;gap:8px;margin-top:12px}
.tab-riga button{flex:1;font:600 15px system-ui,sans-serif;padding:8px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--fg)}
.tab-riga button.attivo{background:var(--fg);color:var(--bg)}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--ln)}
th{font-size:13px;color:var(--mu);font-weight:600}
td.pos{font-weight:700;width:28px}td.pen{font-weight:700;text-align:right}
tr.me{background:color-mix(in srgb, var(--fg) 8%, transparent)}
</style></head><body>
<h1 id="t">Regolarità live</h1><div class="mu" id="s">Connessione…</div>
<div class="filtro-riga" id="filtroRiga" style="display:none">
  <label for="filtro">Equipaggio:</label>
  <select id="filtro"><option value="">Tutti</option></select>
</div>
<div class="tab-riga">
  <button id="tabLive" class="attivo">Live</button>
  <button id="tabClassifica">Classifica</button>
</div>
<div id="vistaLive">
  <div id="cur"></div><h2>Prove precedenti</h2><div id="prev"></div>
</div>
<div id="vistaClassifica" style="display:none">
  <p class="mu" style="margin-top:12px">Per ogni equipaggio conta il suo tentativo migliore (penalità più bassa). Solo i passaggi con un tempo target impostato contribuiscono alla penalità.</p>
  <div id="classifica"></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const $=i=>document.getElementById(i),q=new URLSearchParams(location.search);
// Tiene lo schermo acceso finche' la pagina resta aperta (se il browser lo supporta).
let wakeLock=null;
async function chiediWakeLock(){
  try{ if("wakeLock" in navigator) wakeLock=await navigator.wakeLock.request("screen"); }
  catch(e){ /* non supportato o negato: la pagina funziona comunque */ }
}
chiediWakeLock();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") chiediWakeLock(); });
const db=q.get("db"),tk=q.get("s");
if(!db||!tk){$("s").textContent="Link non valido: usa il link condiviso dal tablet."}
else{
try{
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=ms=>(ms/1000).toFixed(2);
const cls=sc=>{const c=Math.round(sc/10);return c===0?"g":c<0?"b":"r"};
const sgn=sc=>{const r=Math.round(sc/10)/100;return (r>0?"+":"")+r.toFixed(2)};
const rows=(a,circ)=>a.map(x=>`<div class="row"><div><div class="et">${circ?`Giro ${esc(x.giro)} · `:""}P${esc(x.p)}</div><div class="mu">${x.int==null?"Partenza":fmt(x.int)+" s"}</div></div>${x.sc==null?"":`<div class="sc ${cls(x.sc)}">${sgn(x.sc)} s</div>`}</div>`).join("");
const titolo=x=>esc(x.nome)+(x.auto?" · Auto "+esc(x.auto):"")+(x.tentativo>1?" · Tentativo "+esc(x.tentativo):"");
const open=new Set(),seen=new Set();
$("prev").addEventListener("toggle",e=>{const k=e.target.dataset.k;if(k){e.target.open?open.add(k):open.delete(k)}},true);

// Filtro "il mio equipaggio": la scelta resta ricordata su questo telefono per questa sessione.
const chiaveFiltro="rf_"+tk;
let filtro=localStorage.getItem(chiaveFiltro)||"";
const selFiltro=$("filtro");
if(selFiltro){
  selFiltro.addEventListener("change",()=>{
    filtro=selFiltro.value;
    if(filtro) localStorage.setItem(chiaveFiltro,filtro); else localStorage.removeItem(chiaveFiltro);
    if(ultimoSnapshot) disegna(ultimoSnapshot);
  });
}
let ultimoSnapshot=null;

// Tab Live / Classifica: la classifica si ricalcola dagli stessi dati, non serve altro dal tablet.
const tabLive=$("tabLive"),tabClassifica=$("tabClassifica");
const vistaLive=$("vistaLive"),vistaClassifica=$("vistaClassifica");
tabLive.addEventListener("click",()=>{
  tabLive.classList.add("attivo");tabClassifica.classList.remove("attivo");
  vistaLive.style.display="";vistaClassifica.style.display="none";
});
tabClassifica.addEventListener("click",()=>{
  tabClassifica.classList.add("attivo");tabLive.classList.remove("attivo");
  vistaClassifica.style.display="";vistaLive.style.display="none";
});

function renderClassifica(list){
  // Media = somma di |scarto| su TUTTI i passaggi giudicati di tutti i tentativi di un equipaggio,
  // diviso il numero di quei passaggi. Anticipo e ritardo pesano allo stesso modo (valore assoluto).
  const perNome=new Map();
  list.forEach(r=>{
    const nome=r.a[0]?.nome; if(!nome) return;
    const voce=perNome.get(nome)||{nome,auto:r.a[0]?.auto||"",tentativi:0,sommaAssoluti:0,numGiudicati:0};
    voce.tentativi++;
    r.a.forEach(x=>{ if(x.sc!=null){ voce.sommaAssoluti+=Math.abs(x.sc); voce.numGiudicati++; } });
    perNome.set(nome,voce);
  });
  const classificati=[...perNome.values()].filter(v=>v.numGiudicati>0).sort((a,b)=>(a.sommaAssoluti/a.numGiudicati)-(b.sommaAssoluti/b.numGiudicati));
  const nonClassificati=[...perNome.values()].filter(v=>v.numGiudicati===0);

  if(!classificati.length && !nonClassificati.length){
    $("classifica").innerHTML='<div class="mu">Nessuna prova completata finora.</div>';
    return;
  }
  let html='<table><tr><th></th><th>Equipaggio</th><th>Tentativi</th><th style="text-align:right">Scarto medio</th></tr>';
  classificati.forEach((v,i)=>{
    const sel=filtro&&v.nome===filtro?"me":"";
    const media=v.sommaAssoluti/v.numGiudicati;
    html+=`<tr class="${sel}"><td class="pos">${i+1}</td><td>${esc(v.nome)}${v.auto?' · Auto '+esc(v.auto):""} <span class="mu">(su ${v.numGiudicati} passaggi)</span></td><td>${v.tentativi}</td><td class="pen">${(media/1000).toFixed(2)} s</td></tr>`;
  });
  html+="</table>";
  if(nonClassificati.length){
    html+='<p class="mu" style="margin-top:14px">Senza scarto calcolabile (nessun target impostato sui loro passaggi):</p><table>';
    nonClassificati.forEach(v=>{
      html+=`<tr><td></td><td>${esc(v.nome)}${v.auto?' · Auto '+esc(v.auto):""}</td><td>${v.tentativi}</td><td class="pen">—</td></tr>`;
    });
    html+="</table>";
  }
  $("classifica").innerHTML=html;
}

function disegna(v){
  $("s").textContent="Aggiornato alle "+new Date().toLocaleTimeString("it-IT");
  $("t").textContent=v.meta?.nome||"Regolarità live";
  const circ=v.meta?.modalita==="CIRCUITO",runs={};
  Object.values(v.passaggi||{}).forEach(x=>(runs[x.run]??=[]).push(x));
  const list=Object.entries(runs).map(([k,a])=>{a.sort((m,n)=>m.ordine-n.ordine);return{k,a,ts:Math.max(...a.map(x=>x.ts))}}).sort((m,n)=>n.ts-m.ts);
  const st=v.stato||{};
  const liveKeys=new Set(Object.values(st).filter(s=>s&&s.attiva).map(s=>s.run));

  // Popola la tendina con gli equipaggi visti finora, senza perdere la selezione corrente.
  if(selFiltro){
    const nomi=new Set();
    Object.values(st).forEach(s=>{if(s&&s.nome)nomi.add(s.nome)});
    list.forEach(r=>{if(r.a[0]&&r.a[0].nome)nomi.add(r.a[0].nome)});
    if(nomi.size){
      $("filtroRiga").style.display="flex";
      const attuali=new Set([...selFiltro.options].map(o=>o.value));
      [...nomi].sort((a,b)=>a.localeCompare(b,"it")).forEach(n=>{
        if(!attuali.has(n)){const o=document.createElement("option");o.value=n;o.textContent=n;selFiltro.appendChild(o)}
      });
      selFiltro.value=filtro;
    }
  }

  const corrisponde=nome=>!filtro||nome===filtro;

  const liveFiltrate=[...liveKeys].filter(k=>{
    const s=Object.values(st).find(x=>x.run===k);
    return s&&corrisponde(s.nome);
  });
  $("cur").innerHTML=liveFiltrate.length
    ?liveFiltrate.map(k=>{
        const s=Object.values(st).find(x=>x.run===k)||{};
        const a=runs[k]||[];
        return `<h2><span class="live">● IN CORSA</span> ${titolo(s)}</h2>`+(a.length?rows(a,circ):'<div class="mu">In attesa del primo passaggio…</div>');
      }).join("")
    :`<h2 class="mu">${filtro?"Nessuna prova in corso per questo equipaggio":"Nessuna prova in corso"}</h2>`;

  const prev=list.filter(r=>!liveKeys.has(r.k)&&corrisponde(r.a[0]?.nome));
  prev.forEach(r=>{if(!seen.has(r.k)){seen.add(r.k);open.add(r.k)}});
  $("prev").innerHTML=prev.length
    ?prev.map(r=>`<details data-k="${esc(r.k)}" ${open.has(r.k)?"open":""}><summary>${titolo(r.a[0])}</summary>${rows(r.a,circ)}</details>`).join("")
    :`<div class="mu">${filtro?"Nessuna prova completata per questo equipaggio.":"Nessuna prova completata."}</div>`;

  renderClassifica(list);
}

onValue(ref(getDatabase(initializeApp({databaseURL:db})),"live/"+tk),snap=>{
  const v=snap.val();
  if(!v){$("s").textContent="In attesa di dati…";return}
  ultimoSnapshot=v;
  try{ disegna(v); }catch(e){ $("s").textContent="Errore nella pagina: "+e.message; console.error(e); }
},err=>{$("s").textContent="Errore di connessione: "+err.message});
}catch(e){
  $("s").textContent="Errore nella pagina: "+e.message;
  console.error(e);
}
}
</script></body></html>
